version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies", "supply-chain"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/plugins/workflow-skill-router"
    schedule:
      interval: "weekly"
    groups:
      plugin-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      plugin-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies", "plugin"]
    commit-message:
      prefix: "build(plugin)"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      site-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies", "documentation"]
    commit-message:
      prefix: "build(site)"
