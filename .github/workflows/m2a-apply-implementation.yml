name: M2-A Apply Implementation

# Repair note: this definition binds the complete five-part source patch.
on:
  push:
    branches: [codex/memory-m2a-repair]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify M2-A implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Verify and apply authenticated M2-A patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = [
              Path('.github/m2a-patch.part-00'),
              Path('.github/m2a-patch.part-01'),
              Path('.github/m2a-patch.part-02'),
              Path('.github/m2a-patch.part-03'),
              Path('.github/m2a-patch.part-04'),
          ]
          encoded = ''.join(''.join(path.read_text(encoding='utf-8').split()) for path in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '8b72df9c58bd9f0a2c1e5b4d7d3e30b77c0ad3780cc654f1b683da2143048ad4'
          if digest != expected:
              raise SystemExit(f'M2-A patch digest mismatch: {digest}')
          Path('/tmp/m2a.patch').write_bytes(patch)
          PY
          git apply --check --binary /tmp/m2a.patch
          git apply --binary /tmp/m2a.patch
          rm -f \
            .github/m2a-patch.part-00 \
            .github/m2a-patch.part-01 \
            .github/m2a-patch.part-02 \
            .github/m2a-patch.part-03 \
            .github/m2a-patch.part-04 \
            .github/workflows/m2a-apply-implementation.yml
          git diff --check
      - name: Rebuild Runtime and closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python plugins/workflow-skill-router/scripts/build-runtime.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          runtime = Path('plugins/workflow-skill-router/runtime/workflow_skill_router.pyz')
          closure = Path('release/v2-inherited-change-closure.json')
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          text = closure.read_text(encoding='utf-8')
          pattern = re.compile(r'("path":"plugins/workflow-skill-router/runtime/workflow_skill_router\.pyz"[^\n]*?"sha256":")[0-9a-f]{64}("})')
          updated, count = pattern.subn(r'\g<1>' + digest + r'\2', text, count=1)
          if count != 1:
              raise SystemExit('runtime closure entry not found exactly once')
          closure.write_text(updated, encoding='utf-8', newline='\n')
          PY
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Verify focused M2-A contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest \
            memory.test_candidate_migration \
            memory.test_candidate_engine \
            memory.test_candidate_suppression \
            cli.test_memory_candidates_cli \
            schemas.test_schema_documents \
            -v
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/workflow-skill-router/package-lock.json
      - name: Install Plugin dependencies
        working-directory: plugins/workflow-skill-router
        run: npm ci
      - name: Verify full Router Core and repository contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest discover -s packages/router-core/tests -p "test_*.py" -v
          python -m unittest discover -s tests -p "test_*.py" -v
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Verify Plugin and MCP
        working-directory: plugins/workflow-skill-router
        run: npm run check && node ./scripts/smoke-plugin.mjs
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(memory): materialize deterministic workflow candidates'
          git push origin HEAD:codex/memory-m2a-repair
