name: M1-A Memory Store Contract

on:
  push:
    branches:
      - codex/memory-m1-store

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Run M1-A contract tests
        env:
          PYTHONPATH: packages/router-core/src
        run: |
          python -m unittest discover -s packages/router-core/tests/memory -p "test_memory_*.py" -v
          python -m unittest discover -s packages/router-core/tests/memory -p "test_policy_snapshot.py" -v
          python -m unittest discover -s packages/router-core/tests/schemas -p "test_schema_documents.py" -v
