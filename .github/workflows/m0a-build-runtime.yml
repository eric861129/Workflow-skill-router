name: M0-A Bundle Python Runtime

on:
  push:
    branches: [codex/memory-m0-policy-contract]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m0a-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/memory-m0-policy-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build deterministic runtime
        run: python plugins/workflow-skill-router/scripts/build-runtime.py
      - name: Verify deterministic runtime
        run: python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Commit runtime bundle when changed
        shell: bash
        run: |
          set -euo pipefail
          git add plugins/workflow-skill-router/runtime/workflow_skill_router.pyz
          if git diff --cached --quiet; then
            echo "Runtime bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(plugin): bundle memory policy contract"
          git push origin HEAD:codex/memory-m0-policy-contract
