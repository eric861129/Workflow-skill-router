name: M2-B Apply Implementation

on:
  push:
    branches: [codex/memory-m2-profile-proposals]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify M2-B implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Verify and apply authenticated M2-B patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = ''.join(Path('.github/m2b.patch.b64').read_text(encoding='utf-8').split())
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '2c131b13af488bb033bc90280cc98b1e6bdb3c0d9de72b413ed7b5e5d9bba463'
          if digest != expected:
              raise SystemExit(f'M2-B patch digest mismatch: {digest}')
          Path('/tmp/m2b.patch').write_bytes(patch)
          PY
          git apply --check --binary /tmp/m2b.patch
          git apply --binary /tmp/m2b.patch
          rm -f .github/m2b.patch.b64 .github/workflows/m2b-apply-implementation.yml
          git diff --check
      - name: Rebuild Runtime and closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python plugins/workflow-skill-router/scripts/build-runtime.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          runtime = Path('plugins/workflow-skill-router/runtime/workflow_skill_router.pyz')
          closure = Path('release/v2-inherited-change-closure.json')
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          text = closure.read_text(encoding='utf-8')
          pattern = re.compile(r'("path":"plugins/workflow-skill-router/runtime/workflow_skill_router\.pyz"[^\n]*?"sha256":")[0-9a-f]{64}("})')
          updated, count = pattern.subn(r'\g<1>' + digest + r'\2', text, count=1)
          if count != 1:
              raise SystemExit('runtime closure entry not found exactly once')
          closure.write_text(updated, encoding='utf-8', newline='\n')
          PY
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Verify focused M2-B contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest memory.test_profile_diff memory.test_profile_backtest memory.test_profile_proposals memory.test_memory_migrator memory.test_memory_store schemas.test_schema_documents -v
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/workflow-skill-router/package-lock.json
      - name: Install Plugin dependencies
        working-directory: plugins/workflow-skill-router
        run: npm ci
      - name: Verify full Router Core and repository contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest discover -s packages/router-core/tests -p "test_*.py" -v
          python -m unittest discover -s tests -p "test_*.py" -v
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Verify Plugin and MCP
        working-directory: plugins/workflow-skill-router
        run: npm run check && node ./scripts/smoke-plugin.mjs
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(memory): create reviewable profile update proposals'
          git push origin HEAD:codex/memory-m2-profile-proposals
