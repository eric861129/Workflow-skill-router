name: M4-B Patch v6b

on:
  push:
    branches: [codex/m4b-runner-now]
    paths: [.github/workflows/m4b-patch-v6b.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Patch v6 verification workflow
        run: python .github/m4b/patch_v6.py
      - name: Commit corrected verification prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m4b-implement-and-verify-v6.yml
          git commit -m 'ci(memory): complete M4-B release verification prerequisites'
          git push origin HEAD:codex/m4b-runner-now
