name: M1-C Workspace Export

on:
  push:
    branches: [codex/memory-m1-analytics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export isolated M1-C workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M1-C branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create source archive outside checkout
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/m1c-workspace.tar.gz" .
      - name: Upload workspace archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1c-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/m1c-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
