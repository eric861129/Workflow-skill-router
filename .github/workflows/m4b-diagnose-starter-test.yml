name: M4-B Diagnose MDX Source

on:
  push:
    branches:
      - codex/m4b-materialize-approved
    paths:
      - .github/workflows/m4b-diagnose-starter-test.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Reconstruct patch and print suspicious MDX lines
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/m4b-final.patch.part-00 \
            .github/m4b-final.patch.part-01 \
            .github/m4b-final.patch.part-02 \
            .github/m4b-final.patch.part-03 \
            .github/m4b-final.patch.part-04 \
            .github/m4b-final.patch.part-05 \
            .github/m4b-final.patch.part-06-fixed \
            .github/m4b-final.patch.part-07 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > /tmp/m4b.patch
          git checkout --detach fcd849bd1c63d43c2182ccdb15e05f8de750e9f3
          git apply --check --binary /tmp/m4b.patch
          git apply --binary /tmp/m4b.patch

          echo '=== all suspicious MDX tokens ==='
          grep -RIn --include='*.mdx' '<!' site/src/content/docs || true
          echo '=== English MCP reference lines 45-70 ==='
          nl -ba site/src/content/docs/reference/mcp-tools.mdx | sed -n '45,70p'
          echo '=== zh-TW MCP reference lines 45-70 ==='
          nl -ba site/src/content/docs/zh-tw/reference/mcp-tools.mdx | sed -n '45,70p'
