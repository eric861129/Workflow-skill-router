name: M1-C Apply Implementation

on:
  push:
    branches: [codex/memory-m1-analytics]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify M1-C implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/workflow-skill-router/package-lock.json
      - name: Verify and apply authenticated M1-C patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/m1c-patch.part-00 \
            .github/m1c-patch.part-01 \
            .github/m1c-patch.part-02 \
            > /tmp/m1c.patch.gz.b64
          printf '%s  %s\n' '4370e5a5927f64d2e27520f83a33795b9ac253720fdadd5654d56799ae26c334' '/tmp/m1c.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/m1c.patch.gz.b64 | gzip --decompress > /tmp/m1c.patch
          printf '%s  %s\n' 'be0403db9908dcd424e3a63e93d825fe086a7959d1e8b88dabf23e47a92056a3' '/tmp/m1c.patch' | sha256sum --check --strict
          git apply --check --binary --exclude=.github/workflows/m1c-workspace-export.yml /tmp/m1c.patch
          git apply --binary --exclude=.github/workflows/m1c-workspace-export.yml /tmp/m1c.patch
          rm -f \
            .github/m1c-patch.part-00 \
            .github/m1c-patch.part-01 \
            .github/m1c-patch.part-02 \
            .github/workflows/m1c-apply-implementation.yml
          git diff --check
      - name: Verify focused M1-C contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest \
            memory.test_route_feedback \
            memory.test_history_analytics \
            memory.test_retention_and_purge \
            cli.test_memory_history_cli \
            schemas.test_schema_documents \
            -v
      - name: Verify full Router Core and repository contracts
        env:
          PYTHONPATH: packages/router-core/src:packages/router-core/tests
        run: |
          python -m unittest discover -s packages/router-core/tests -p "test_*.py" -v
          python -m unittest discover -s tests -p "test_*.py" -v
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
      - name: Verify Plugin and MCP
        working-directory: plugins/workflow-skill-router
        run: npm ci && npm run check && node ./scripts/smoke-plugin.mjs
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(memory): add route feedback and history analytics'
          git push origin HEAD:codex/memory-m1-analytics
