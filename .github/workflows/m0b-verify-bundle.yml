name: M0-B Verify and Bundle

on:
  push:
    branches: [codex/memory-m0-policy-resolution]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m0b-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/memory-m0-policy-resolution
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run M0-B focused tests
        env:
          PYTHONPATH: packages/router-core/src
        run: |
          python -m unittest discover -s packages/router-core/tests/memory -p "test_policy_io.py" -v
          python -m unittest discover -s packages/router-core/tests/memory -p "test_policy_resolver.py" -v
          python -m unittest discover -s packages/router-core/tests/cli -p "test_memory_cli.py" -v
      - name: Build deterministic runtime
        run: python plugins/workflow-skill-router/scripts/build-runtime.py
      - name: Synchronize runtime closure digest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path("plugins/workflow-skill-router/runtime/workflow_skill_router.pyz")
          closure = Path("release/v2-inherited-change-closure.json")
          document = json.loads(closure.read_text(encoding="utf-8"))
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          for entry in document["entries"]:
              if entry["path"] == bundle.as_posix():
                  entry["evidence"] = {
                      "kind": "current-content-digest",
                      "sha256": digest,
                  }
                  break
          else:
              raise SystemExit("runtime closure entry missing")
          closure.write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify deterministic runtime and closure
        run: |
          python plugins/workflow-skill-router/scripts/build-runtime.py --check
          python -m unittest tests.test_inherited_change_closure -v
      - name: Remove temporary workflow and commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m0b-verify-bundle.yml
          git add \
            plugins/workflow-skill-router/runtime/workflow_skill_router.pyz \
            release/v2-inherited-change-closure.json \
            .github/workflows/m0b-verify-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(plugin): bundle memory policy resolution"
          git push origin HEAD:codex/memory-m0-policy-resolution
