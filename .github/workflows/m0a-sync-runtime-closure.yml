name: M0-A Sync Runtime Closure

on:
  push:
    branches: [codex/memory-m0-policy-contract]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m0a-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/memory-m0-policy-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Synchronize runtime closure digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          runtime = Path("plugins/workflow-skill-router/runtime/workflow_skill_router.pyz")
          closure = Path("release/v2-inherited-change-closure.json")
          digest = sha256(runtime.read_bytes()).hexdigest()
          text = closure.read_text(encoding="utf-8")
          pattern = re.compile(
              r'("path":"plugins/workflow-skill-router/runtime/workflow_skill_router\.pyz"'
              r'.*?"sha256":")[0-9a-f]{64}("})'
          )
          updated, count = pattern.subn(rf"\g<1>{digest}\g<2>", text, count=1)
          if count != 1:
              raise SystemExit("runtime closure entry not found exactly once")
          closure.write_text(updated, encoding="utf-8")
          print(f"runtime sha256:{digest}")
          PY
      - name: Verify inherited-change closure
        run: python -m unittest tests.test_inherited_change_closure -v
      - name: Remove temporary workflow and commit closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m0a-sync-runtime-closure.yml
          git add release/v2-inherited-change-closure.json .github/workflows/m0a-sync-runtime-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(plugin): sync runtime closure evidence"
          git push origin HEAD:codex/memory-m0-policy-contract
